name: Build CapybaraSMP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build JAR
        run: |
          mkdir -p build
          jar cf build/CapybaraSMP.jar .

      - name: Upload CapybaraSMP.jar
        uses: actions/upload-artifact@v4
        with:
          name: CapybaraSMP
          path: build/CapybaraSMP.jar
